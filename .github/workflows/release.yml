name: Release

# Publishing uses PyPI "trusted publishing": PyPI trusts this workflow, so no API token is stored anywhere.
#
#   TestPyPI (rehearsal): Actions -> Release -> Run workflow, choose "testpypi".
#   PyPI (real):          create a GitHub Release (tag v0.1.0, ...) -> this workflow publishes it.
#
# One-time setup on each index (Account -> Publishing -> "Add a pending publisher"):
#   project kenlang | owner rafal-chalimoniuk | repository kenlang | workflow release.yml
#   environment: testpypi on test.pypi.org, pypi on pypi.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine -e ".[dev]"
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The tag must match the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import kenlang; print(kenlang.__version__)")
          test "v$version" = "${{ github.event.release.tag_name }}" || {
            echo "release tag ${{ github.event.release.tag_name }} != package version v$version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
